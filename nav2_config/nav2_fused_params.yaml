# Fused-localization-only Nav2 parameters.
# TF contract: map -> odom -> base_footprint -> base_link.  The dual EKFs own
# map->odom and odom->base_footprint; URDF owns the fixed body-height edge.
# The legacy pure-ICP navigation continues to use nav2_params.yaml unchanged.

amcl:
  ros__parameters:
    use_sim_time: False
    # AMCL 参数保留不动，因为已被 Lifecycle Manager 禁用，不会生效
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.10
    alpha4: 0.10
    alpha5: 0.10
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 0.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 30
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    # Fused-localization local EKF output; do not alias this onto legacy /odom.
    odom_topic: /localization/odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: $(env GO2_NAV_ROOT)/nav2_config/navigate_to_pose_w_smoothing.xml
    default_nav_through_poses_bt_xml: $(env GO2_NAV_ROOT)/nav2_config/navigate_through_poses_w_replanning_no_spin.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: false
    # Keep controller speed feedback on the same odom->base_footprint estimate used by TF.
    odom_topic: /localization/odometry/local
    controller_frequency: 15.0
    costmap_update_timeout: 0.35
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 36
      model_dt: 0.07
      batch_size: 900
      ax_max: 4.0
      ax_min: -4.0
      ay_max: 2.0
      az_max: 3.0
      vx_std: 0.15
      vy_std: 0.10
      wz_std: 0.45
      vx_max: 1.0
      vx_min: -0.25
      vy_max: 0.30
      wz_max: 1.4
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      regenerate_noises: false
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 32.0
        critical_cost: 230.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.2
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      # PointCloud2 source for local obstacle avoidance.
      # Use the real topic name for the QoS override; source-name overrides are not applied by rclcpp.
      qos_overrides./scan_obstacles.subscription.reliability: best_effort

      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      use_sim_time: False
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.0
      footprint: "[[0.38, 0.175], [0.38, -0.175], [-0.38, -0.175], [-0.38, 0.175]]"
      footprint_padding: 0.06
      plugins: ["obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.2
        inflation_radius: 0.58

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        footprint_clearing_enabled: true
        enabled: true

        # 1. 声明数据源名称
        observation_sources: pointcloud_sensor

        # 2. 动态障碍物配置 (3D点云版)
        observation_keep_time: 0.5  # Keep dynamic obstacles responsive; long persistence can pin the robot in place.
        expected_update_rate: 0.0

        pointcloud_sensor:
          topic: /scan_obstacles
          sensor_frame: icp_tracking_frame
          data_type: "PointCloud2"
          marking: True
          clearing: True
          observation_persistence: 0.0
          expected_update_rate: 0.0

          # ★ 高度过滤（点云转换到 odom 后的绝对 Z）★
          # ObservationBuffer transforms the cloud into the costmap global
          # frame before height filtering.  Ground returns are therefore near
          # Z=0, not -0.44 m as they are in the LiDAR frame.  An 8 cm margin
          # rejects floor noise while retaining practical low obstacles.
          min_obstacle_height: 0.08
          max_obstacle_height: 1.50

          obstacle_max_range: 4.0
          raytrace_max_range: 5.0

          # 清除参数
          obstacle_min_range: 0.1
          raytrace_min_range: 0.1
          inf_is_valid: false

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0   # 既然只用静态地图，更新频率可以大幅降低（如 1Hz），非常节省资源
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.0
      footprint: "[[0.30, 0.175], [0.30, -0.175], [-0.38, -0.175], [-0.38, 0.175]]"
      footprint_padding: 0.10
      resolution: 0.05
      track_unknown_space: true

      # Include live obstacles in the global costmap so replanning can route around blocked paths.
      qos_overrides./scan_obstacles.subscription.reliability: best_effort
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: pointcloud_sensor
        observation_keep_time: 1.0
        expected_update_rate: 0.0

        pointcloud_sensor:
          topic: /scan_obstacles
          sensor_frame: icp_tracking_frame
          data_type: "PointCloud2"
          marking: True
          clearing: True
          observation_persistence: 0.0
          expected_update_rate: 0.0
          # The cloud is transformed to map before filtering. Keep the live
          # band identical to the local layer so neither floor nor ceiling
          # points are re-introduced into the global costmap.
          min_obstacle_height: 0.08
          max_obstacle_height: 1.50
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          obstacle_min_range: 0.1
          raytrace_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.2
        inflation_radius: 0.62

      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "$(env GO2_NAV_ROOT)/maps/map_latest.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      # 1. 更改插件名称
      plugin: "nav2_smac_planner/SmacPlanner2D"

      # 2. SmacPlanner2D 的参数配置
      tolerance: 0.1             # 允许到达目标点的误差范围
      downsampling_factor: 1     # 下采样因子，1表示使用全分辨率，增大可加快计算但降低精度
      allow_unknown: true        # 是否允许在未知区域规划

      # A* 启发式参数
      cost_travel_multiplier: 1.8

      # 平滑处理的关键参数
      # SmacPlanner2D 生成的路径默认就是 8 连通或 4 连通的折线
      # 它的"平滑"主要依赖后续的 smoother_server，或者你可以开启下面的参数做简单的平滑
      smooth_path: true          # 开启简单的内部平滑

      # 运动模型类型 (对于全向移动机器人/机器狗，通常选 2D)
      motion_model_for_search: "2D"  # 可选: "2D", "DUBINS", "REEDS_SHEPP"
# -----------------------------
# Collision Monitor (修改为点云源)
# -----------------------------
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    transform_tolerance: 0.2
    source_timeout: 0.5
    stop_pub_timeout: 0.2
    enabled: false

    # 如果 Collision Monitor 报错收不到数据，尝试解开下面这行的注释
    # qos_overrides./pointcloud_source.subscription.reliability: best_effort

    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe

    # 1. 修改源名称
    observation_sources: ["pointcloud_source"]

    # 2. 配置点云源 (注意：这里必须与 observation_sources 列表中的名字一致)
    pointcloud_source:
      type: "pointcloud"
      topic: "/cloud_registered_body"
      min_height: 0.08
      max_height: 1.50

    polygons: ["SlowZone", "StopZone"]

    SlowZone:
      type: "circle"
      radius: 1.4
      action_type: "slowdown"
      slowdown_ratio: 0.35

    StopZone:
      type: "circle"
      radius: 0.90
      action_type: "stop"

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 2000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "assisted_teleop", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.25
    rotational_acc_lim: 2.4

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.30, 1.4]
    min_velocity: [-0.25, -0.30, -1.4]
    max_accel: [4.0, 1.5, 3.0]
    max_decel: [-4.0, -1.5, -3.0]
    odom_topic: /localization/odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# -----------------------------
# Lifecycle Manager - Localization
# -----------------------------
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      # - amcl  <-- 必须保持注释状态，因为 Fast_LIO 负责定位

# -----------------------------
# Lifecycle Manager - Navigation
# -----------------------------
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - global_costmap/global_costmap
      - local_costmap/local_costmap
